platform: Two-stage light-gas gun at the Institute for Shock Physics, Washington State University.
methods:
- Front-Surface-Impact (FSI) experiments were used to determine longitudinal sound speeds.
- Fused silica mounted on the projectile impacted a LiF window.
- Two identical experiments were carried out at most target stresses to establish reproducibility.
calibration:
- Shock velocity in the fused silica impactor was determined using the particle velocity and a linear Us-Up relationship determined from wave-transmission experiments: Us = 0.62(7) + 1.74(2)Up.
